name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "scripts/smoke-compose.sh"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "scripts/smoke-compose.sh"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests and pgvector integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_document_assistant_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_document_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-postgres-password@127.0.0.1:5432/ai_document_assistant_test
      LLM_MODEL: ci-test-generation-model
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Migrate test database
        working-directory: backend
        run: alembic upgrade head
      - name: Run unit and integration tests
        working-directory: backend
        run: python -m pytest -q

  compose-smoke:
    name: Build and verify local Compose stack
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      LLM_MODEL: ci-test-generation-model
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start backend + database
        run: docker compose up --build --wait -d
      - name: Verify application and DB readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/health/database
          docker compose exec -T postgres psql -U postgres -d ai_document_assistant -tAc "SELECT version_num FROM alembic_version" | grep -Fx '0003_create_document_chunks'
      - name: Stop development services
        if: always()
        run: docker compose down
